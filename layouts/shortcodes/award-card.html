<!-- AWARD IMAGE -->
<div class="award-image-wrapper">

  {{ if .Get "image" }}

    <img
      src="{{ .Get "image" | relURL }}"
      alt="{{ .Get "title" }}"
      class="award-image"
      loading="lazy"
    >

  {{ else }}

    <div class="award-image-placeholder">
      <span>Award Image</span>
    </div>

  {{ end }}

</div>
