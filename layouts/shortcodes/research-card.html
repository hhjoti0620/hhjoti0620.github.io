<div class="research-card">

  <div class="research-number">
    {{ .Get "number" }}
  </div>

  <div class="research-content">

    <h3>
      {{ .Get "title" }}
    </h3>

    <p class="research-subtitle">
      {{ .Get "subtitle" }}
    </p>

    <p class="research-description">
      {{ .Get "description" }}
    </p>

    <div class="research-meta">

      <span>
        <strong>Organization:</strong>
        {{ .Get "organization" }}
      </span>

      <span>
        <strong>Date:</strong>
        {{ .Get "date" }}
      </span>

    </div>

  </div>

  {{ if .Get "kaggle" }}
  <div class="research-actions">

    <a
      href="{{ .Get "kaggle" }}"
      target="_blank"
      rel="noopener"
      class="research-button"
    >
      <span>↗</span>
      Kaggle Competition
    </a>

  </div>
  {{ end }}

</div>
