<div class="certificate-card">

  <div class="certificate-content">

    <h3>{{ .Get "title" }}</h3>

  </div>

  <div class="certificate-image-wrapper">
    <img
      src="{{ .Get "image" | relURL }}"
      alt="{{ .Get "title" }}"
      class="certificate-image"
      loading="lazy"
    >
  </div>

</div>
